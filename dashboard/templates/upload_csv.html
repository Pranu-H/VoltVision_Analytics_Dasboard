<!DOCTYPE html>
<html>
<head>
    <title>Upload CSV</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2 class="mb-4">
            Upload EV CSV File 📂
        </h2>

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-primary">

                Upload CSV
            </button>

        </form>

    </div>

</div>

</body>
</html>
